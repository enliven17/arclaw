[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"          # D20 SDK sources pin 0.8.28
evm_version = "cancun"   # D20 guidance for Arc
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../lib/deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 32
